[package]
name = "mackernel-server"
version = "0.1.0"
edition = "2021"
description = "REST + SSE service that queues and runs mackernel reproducer bundles"

[[bin]]
name = "mackernel-server"
path = "src/main.rs"

[features]
# Heap profiling via dhat-rs. Build with `--profile profiling --features dhat-heap`,
# run, and on clean exit it writes dhat-heap.json (view at https://nnethercote.github.io/dh_view/dh_view.html).
dhat-heap = ["dep:dhat"]

# Profiling build: release optimizations + line tables so dhat backtraces symbolize.
# Separate from `release` so the prod binary stays debug-info-free.
[profile.profiling]
inherits = "release"
debug = 1

[dependencies]
dhat = { version = "0.3", optional = true }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "1", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = "8"
mime_guess = "2"
arborium = { version = "2.18.0", features = ["lang-c", "lang-bash"] }

# CPU-only LLM summarizer (see src/summarize.rs): we spawn llama.cpp's
# `llama-server` as a subprocess and talk to its OpenAI-compatible /v1 API.
# reqwest::blocking is only called from blocking contexts (spawn_blocking / a
# dedicated thread). The prebuilt release tarball is unpacked via system `tar`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Human-readable summary generation time ("17s", "2m 3s") for the UI tooltip.
humantime = "2"
