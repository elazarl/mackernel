name: build-push-image

# Build the kernel-build container and publish it to GHCR as multi-arch
# (amd64 + arm64) images, one per gcc version, tagged :<version>-gcc<N>.
# gcc-15 (the default) is also published as :<version> and :latest, so existing
# references keep working. A bundle picks its compiler with a `compiler:` key.

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - Containerfile.opencode
      - VERSION
      - .github/workflows/build-push-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/elazarl/mackernel

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        gcc: ["13", "14", "15"]
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # gcc-15 is the default: also tag it as :<version> and :latest so existing
      # references (which carry no -gcc suffix) keep resolving.
      - name: Compute tags
        id: tags
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAGS="${IMAGE}:${V}-gcc${{ matrix.gcc }}"
          if [ "${{ matrix.gcc }}" = "15" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:${V}"$'\n'"${IMAGE}:latest"
          fi
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3      # enables arm64 emulation on the amd64 runner
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GCC_VERSION=${{ matrix.gcc }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Smoke-test the pushed image (both arches)
        run: |
          set -euo pipefail
          for plat in linux/amd64 linux/arm64; do
            echo "== $plat gcc-${{ matrix.gcc }} =="
            docker run --rm --platform "$plat" "${IMAGE}:${{ steps.ver.outputs.version }}-gcc${{ matrix.gcc }}" \
              bash -c 'gcc-${{ matrix.gcc }} --version | head -1 && make --version | head -1'
          done

  # The scaffolding image: the just-pushed gcc-15 build image (:<version>) + the
  # opencode CLI, published multi-arch as :<version>-opencode and :latest-opencode.
  # Needs the gcc-15 base to exist on GHCR first.
  build-push-opencode:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push opencode image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.opencode
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}-opencode
            ${{ env.IMAGE }}:latest-opencode

      - name: Smoke-test opencode (both arches)
        run: |
          set -euo pipefail
          for plat in linux/amd64 linux/arm64; do
            echo "== $plat opencode =="
            docker run --rm --platform "$plat" "${IMAGE}:${{ steps.ver.outputs.version }}-opencode" \
              opencode --version | head -1
          done
