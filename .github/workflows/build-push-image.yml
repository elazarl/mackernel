name: build-push-image

# Build the kernel-build container and publish it to GHCR as a multi-arch
# (amd64 + arm64) image, tagged with the version from the VERSION file.

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - VERSION
      - .github/workflows/build-push-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/elazarl/mackernel

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3      # enables arm64 emulation on the amd64 runner
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}

      - name: Smoke-test the pushed image (both arches)
        run: |
          set -euo pipefail
          for plat in linux/amd64 linux/arm64; do
            echo "== $plat =="
            docker run --rm --platform "$plat" "${IMAGE}:${{ steps.ver.outputs.version }}" \
              bash -c 'gcc-15 --version | head -1 && make --version | head -1'
          done
